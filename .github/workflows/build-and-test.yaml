name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The POSIX shim and the cmd.exe trampoline are separate files with
          # separate logic, so each one is exercised on the platform it serves.
          - os: ubuntu-latest
            flixw: ./flixw
            shell: bash
          - os: macos-latest
            flixw: ./flixw
            shell: bash
          - os: windows-latest
            flixw: .\flixw.cmd
            shell: cmd

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flixw is itself a Java program, so it needs one JDK to start; from there
      # it fetches the compiler pinned in .flixw/lock.toml and verifies it
      # against the committed digest before running it. 21 is the lowest Java
      # the wrapper supports, so CI runs on the oldest JDK this project claims.
      - name: Install JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Wrapper integrity first: the shims match the committed stage 0, the lock
      # satisfies flix.toml, and every generated file is tracked by git. A
      # failure here means the rest of the run would prove nothing.
      - name: Validate the wrapper
        run: ${{ matrix.flixw }} validate

      - name: Check
        run: ${{ matrix.flixw }} check

      - name: Test
        run: ${{ matrix.flixw }} test
