name: Docs

# `./flixw doc` renders this project with the compiler it pins, so the output
# matches that compiler exactly rather than whatever api.flix.dev currently
# serves.
#
# The documentation is built on every push to the default branch, which also
# keeps `doc` itself from breaking unnoticed. Publishing is separate and
# conditional: a repository made from this template may have Pages unavailable
# -- private on a free plan, or disabled by policy -- and inheriting a workflow
# that reddens the default branch on the first push is not a good welcome. When
# Pages cannot be configured the build still runs and says so, loudly, once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write # configure-pages enables Pages through the API

    outputs:
      pages: ${{ steps.pages.outcome }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the pinned compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/flixw
            ~/Library/Caches/flixw
            ~\AppData\Local\flixw
          key: ${{ runner.os }}-flixw-${{ hashFiles('.flixw/lock.toml') }}

      - name: Generate
        run: ./flixw doc

      # Since Flix 0.80, `flix doc` writes only this project: a page per module,
      # a `Source` page per file (`src.*.src.html`) that the definitions link
      # to relatively, and the assets. Nothing has to be filtered or rewritten
      # any more; what is left to do is to put a landing page in front and to
      # refuse to publish anything that is broken.
      - name: Assemble the site
        run: |
          set -euo pipefail

          # A module page is every page that is not `index.html`, the 404 page
          # or a source page. `index.html` is the Prelude page: it holds `main`
          # and the tests, which Flix requires in the root namespace, and the
          # landing page generated below takes that filename.
          pages=$(cd build/doc && ls -1 *.html | grep -vE '^(index|404)\.html$|\.src\.html$' || true)

          # Fail closed. If the layout of the output ever changes upstream this
          # finds nothing, and publishing an empty site quietly would be far
          # worse than stopping here.
          if [ -z "$pages" ]; then
            echo "::error::no module pages found in build/doc -- the flix doc output layout may have changed"
            exit 1
          fi
          echo "publishing: $(echo "$pages" | tr '\n' ' ')"

          rm -rf site
          cp -R build/doc site

          # Fail closed: nothing published may carry a filesystem path.
          if grep -rlF "$PWD" site; then
            echo "::error::a published page still contains a build-machine path"
            exit 1
          fi

          # The landing page is generated rather than committed, so it lists
          # whatever modules the project actually has instead of a name that
          # would drift the first time someone renames one.
          version=$(./flixw info | awk '$1 == "compiler" && $2 ~ /^[0-9]/ { print $2; exit }')
          {
            cat <<HEAD
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>$GITHUB_REPOSITORY | API documentation</title>
          <link rel="icon" href="favicon.png">
          <style>
            :root { color-scheme: light dark; }
            body { margin: 0 auto; padding: 3rem 1.5rem; max-width: 42rem;
                   font: 16px/1.6 Inter, system-ui, sans-serif; }
            h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
            p { color: GrayText; }
            ul { list-style: none; padding: 0; }
            li { margin: .4rem 0; }
            a { color: LinkText; }
            footer { margin-top: 3rem; font-size: .875rem; color: GrayText; }
          </style>
          <h1>$GITHUB_REPOSITORY</h1>
          <p>API documentation, generated by <code>flix doc</code> from the
             compiler this project pins &mdash; Flix $version.</p>
          <h2>Modules</h2>
          <ul>
          HEAD
            while IFS= read -r p; do
              printf '<li><a href="%s">%s</a></li>\n' "$p" "${p%.html}"
            done <<<"$pages"
            cat <<TAIL
          </ul>
          <footer><a href="https://github.com/$GITHUB_REPOSITORY">Source on GitHub</a></footer>
          TAIL
          } > site/index.html

          # Nothing published may point at a page that was not published. The
          # anchor of a link such as `src.Main.src.html#L24` is not part of the
          # file name.
          broken=0
          for f in site/*.html; do
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              if [ ! -f "site/$target" ]; then
                echo "::error::$(basename "$f") links to $target, which is not published"
                broken=1
              fi
            done < <(grep -oE "href='[A-Za-z0-9_.-]+\.html(#[^']*)?'" "$f" | sed -E "s/^href='//; s/(#[^']*)?'$//" | sort -u)
          done
          [ "$broken" -eq 0 ]

      # enablement is kept because it costs nothing where an organisation does
      # grant the Actions token that permission -- but do not count on it: the
      # default GITHUB_TOKEN cannot create a Pages site even with pages:write,
      # and fails here with "Resource not accessible by integration". Pages
      # normally has to be turned on once by hand. Either way that is not a
      # reason to fail the run, so the failure is caught and reported below.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
        with:
          enablement: true

      - name: Report that publishing was skipped
        if: steps.pages.outcome != 'success'
        # A workflow command has to be one line; it is long rather than wrapped.
        run: echo "::warning::Pages is not enabled for this repository, so the documentation was built but not published. Turn it on once under Settings > Pages with source 'GitHub Actions', or delete .github/workflows/docs.yaml."

      - name: Upload
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to Pages
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
